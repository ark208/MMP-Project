services:
  postgres:
    image: postgres:16-alpine
    container_name: campusloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: campusloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: campusloop-server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/campusloop?schema=public"
      USE_MEMORY_DB: "false"
      JWT_SECRET: dev-secret-campusloop-key-min-32-chars-long
      JWT_EXPIRES_IN: 7d
      ALLOWED_EMAIL_DOMAIN: campus.edu
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - server_uploads:/app/server/uploads

  client:
    container_name: campusloop-client
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
      NEXT_PUBLIC_USE_MOCKS: "false"
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  server_uploads:
